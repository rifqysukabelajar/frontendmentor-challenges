<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Newsletter sign-up form with success message">
  <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/icons/favicon-32x32.png">
  <title>Frontend Mentor | Newsletter sign-up form with success message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/app.css">
</head>

<body>
  <main class="newsletter">
    <article class="newsletter__card">
      <div class="newsletter__image" aria-hidden="true">
        <picture>
          <source media="(min-width: 768px)" srcset="./src/assets/images/illustration-sign-up-desktop.svg">
          <img src="./src/assets/images/illustration-sign-up-mobile.svg" alt="" width="375" height="284"
            fetchpriority="high">
        </picture>
      </div>

      <section class="newsletter__content">
        <header class="newsletter__header">
          <h1 class="newsletter-title">Stay updated!</h1>
          <p>Join 60,000+ product managers receiving montly updates on:</p>
        </header>

        <ul class="newsletter__feature">
          <li>
            <img src="./src/assets/icons/icon-list.svg" alt="" width="21" height="21">
            Product discovery and building what matters
          </li>
          <li>
            <img src="./src/assets/icons/icon-list.svg" alt="" width="21" height="21">
            Measuring to ensure updates are a success
          </li>
          <li>
            <img src="./src/assets/icons/icon-list.svg" alt="" width="21" height="21">
            And much more!
          </li>
        </ul>

        <form class="newsletter__form" novalidate>
          <div class="group-form">
            <label for="email">Email address</label>
            <small class="notif"></small>
            <input type="email" name="email" id="email" placeholder="email@company.com" required autocomplete="email">
          </div>

          <button type="submit" class="btn-subscribe">Subscribe to monthly newsletter</button>
        </form>
      </section>
    </article>
  </main>

  <script src="./src/js/main.js"></script>
</body>

</html>
