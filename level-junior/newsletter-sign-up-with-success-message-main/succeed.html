<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Success message for subscribing">
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/icons/favicon-32x32.png">
    <title>Frontend Mentor | Newsletter sign-up form with success message</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/styles/succeed.css">
</head>

<body>
    <main class="login">
        <article class="login__succeed">
            <div class="login__image">
                <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 21 21">
                    <g fill="none">
                        <circle cx="10.5" cy="10.5" r="10.5" fill="#FF6155" />
                        <path stroke="#FFF" stroke-width="1.2" d="M6 11.381 8.735 14 15 8" />
                    </g>
                </svg>
            </div>

            <section class="login__info">
                <h1 class="login-title">Thanks for subscribing!</h1>
                <p class="login-confirmation">A confirmation email has been sent to <b>ash@loremcompany.com.</b> Please
                    open it and click the button inside to confirm your subscription</p>
            </section>

            <button type="button" class="btn-dismiss" aria-label="Dismis message confirmation email">Dismiss
                message</button>
        </article>
    </main>
</body>

</html>
