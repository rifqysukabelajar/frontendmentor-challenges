<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
  <title>Frontend Mentor | E-commerce product page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style/app.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="navbar-open-btn" aria-label="Toggle navigation menu" aria-expanded="false"
          aria-controls="navbar-link">
          <img class="icon-menu" src="./assets/icons/icon-menu.svg" alt="Icon menu navbar" aria-hidden="true" width="18"
            height="18">
        </button>

        <div class="navbar-overlay"></div>

        <div class="navbar-logo-brand">
          <img src="./assets/images/logo.svg" alt="Logo brand Sneakers Company" loading="lazy">
        </div>

        <nav class="navbar-menu">
          <button class="navbar-close-btn" aria-label="Close menu">
            <img class="icon-close-menu" src="./assets/icons/icon-close.svg" alt="Icon close menu navbar"
              aria-hidden="true" width="18" height="18">
          </button>

          <ul id="navbar-link" class="navbar-links">
            <li><a class="nav-link" href="#collections" aria-label="Show all collections shoes">Collections</a>
            </li>
            <li><a class="nav-link" href="#men" aria-label="Show all shoes men">Men</a></li>
            <li><a class="nav-link" href="#women" aria-label="Show all shoes women">Women</a></li>
            <li><a class="nav-link" href="#about" aria-label="Learn more about the Sneakers Company">About</a></li>
            <li><a class="nav-link" href="#contact" aria-label="Contact the Sneakers Company">Contact</a></li>
          </ul>
        </nav>
      </div>

      <div class="navbar-right">
        <button class="navbar-icon-cart">
          <img src="./assets//icons/icon-cart.svg" alt="Icon cart">
        </button>
        <button class="navbar-profile">
          <img src="./assets/images/image-avatar.png" alt="User profile avatar">
        </button>
      </div>
    </nav>
  </header>

  <script type="module" src="./main.js"></script>
</body>

</html>
