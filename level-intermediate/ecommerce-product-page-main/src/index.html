<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description"
    content="E-commerce product page built as a Frontend Mentor challenge. Features responsive design, product image gallery, cart functionality, and clean UI using HTML, CSS, and JavaScript.">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/icons/favicon-32x32.png">
  <title>Frontend Mentor | E-commerce product page</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'">

  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;700&display=swap" rel="stylesheet">
  </noscript>

  <link rel="stylesheet" href="./style/app.css">
</head>

<body>
  <header class="header">
    <nav class="navbar">
      <div class="navbar-left">
        <button class="navbar-open-btn" aria-label="Toggle navigation menu" aria-expanded="false"
          aria-controls="navbar-link">
          <img class="icon-menu" src="./assets/icons/icon-menu.svg" alt="Icon menu navbar" aria-hidden="true" width="18"
            height="18">
        </button>

        <div class="navbar-overlay"></div>

        <div class="navbar-logo-brand">
          <img src="./assets/images/logo.svg" alt="Logo brand Sneakers Company" loading="lazy">
        </div>

        <nav class="navbar-menu" aria-hidden="true">
          <button class="navbar-close-btn" aria-label="Close menu">
            <img class="icon-close-menu" src="./assets/icons/icon-close.svg" alt="Icon close menu navbar"
              aria-hidden="true" width="18" height="18">
          </button>

          <ul id="navbar-link" class="navbar-links">
            <li><a class="nav-link" href="#collections" aria-label="Show all collections shoes">Collections</a>
            </li>
            <li><a class="nav-link" href="#men" aria-label="Show all shoes men">Men</a></li>
            <li><a class="nav-link" href="#women" aria-label="Show all shoes women">Women</a></li>
            <li><a class="nav-link" href="#about" aria-label="Learn more about the Sneakers Company">About</a></li>
            <li><a class="nav-link" href="#contact" aria-label="Contact the Sneakers Company">Contact</a></li>
          </ul>
        </nav>
      </div>

      <div class="navbar-right">
        <button class="navbar-icon-cart">
          <img src="./assets//icons/icon-cart.svg" alt="Icon cart">
        </button>
        <button class="navbar-profile">
          <img src="./assets/images/image-avatar.png" alt="User profile avatar">
        </button>
      </div>
    </nav>
  </header>

  <main>
    <article class="product">
      <div class="product-container">
        <div class="carousel">
          <div class="carousel-track">
            <img src="./assets/images/image-product-1.jpg" alt="Slide 1">
            <img src="./assets/images/image-product-2.jpg" alt="Slide 2">
            <img src="./assets/images/image-product-3.jpg" alt="Slide 3">
            <img src="./assets/images/image-product-4.jpg" alt="Slide 4">
          </div>

          <button class="btn btn-prev" aria-label="Previous slide">
            <img src="./assets/icons/icon-previous.svg" alt="">
          </button>

          <button class="btn btn-next" aria-label="Next slide">
            <img src="./assets/icons/icon-next.svg" alt="">
          </button>
        </div>
        <div class="product-cart">
          <section class="product-info">
            <p class="product-brand">Sneaker Company</p>
            <h1 class="product-title">Fall Limited Edition Sneakers</h1>
            <p class="product-description">These low-profile sneakers are your perfect casual wear companion.
              Featuring a
              durable rubber outer sole, they'll withstand everything the weather can offer.</p>
          </section>

          <section class="product-pricing">
            <div class="price-discount">
              <p class="current-price">$125.00</p>
              <p class="discount-badge">50%</p>
            </div>
            <p class="normal-price">$250.00</p>
          </section>

          <section class="product-actions">
            <div class="quantity-selector">
              <button class="btn btn-minus-quantity" type="button" aria-label="Decrease quantity">
                <img src="./assets/icons/icon-minus.svg" alt="">
              </button>

              <span class="quantity-value" aria-live="polite">0</span>

              <button class="btn btn-plus-quantity" type="button" aria-label="Increase quantity">
                <img src="./assets/icons/icon-plus.svg" alt="">
              </button>
            </div>

            <button class="btn-add-cart" type="button">
              <img src="./assets/icons/icon-cart.svg" alt="">
              <span>Add to cart</span>
            </button>
          </section>
        </div>
      </div>
    </article>
  </main>

  <script type="module" src="./main.js"></script>
</body>

</html>
